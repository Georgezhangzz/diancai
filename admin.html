<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>厨房后台</title>
<style>
  :root{--bg:#fbf6ee;--card:#fffdf9;--ink:#2b2420;--muted:#8a7d72;--line:#ece2d4;--red:#c8372d;--red-soft:#fbe6e2;--green:#3d8b5a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  h1{font-family:"Songti SC","STSong",serif;font-size:26px;margin:6px 0 16px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px;font-size:15px;cursor:pointer;color:var(--ink)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .muted{color:var(--muted);font-size:13px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  input[type=text],input[type=password],textarea,select{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
  textarea{min-height:64px}
  .btn{border:none;border-radius:999px;padding:10px 16px;font-size:14px;cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn:disabled{opacity:.6}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
  .preview{width:120px;aspect-ratio:4/3;border-radius:10px;background:#f2e8da center/cover;display:flex;align-items:center;justify-content:center;color:#cbb9a1;font-size:30px;flex:none}
  .dish{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .dish .grow{min-width:140px}
  .tag{white-space:nowrap}
  @media(max-width:520px){.dish>.row{width:100%;justify-content:flex-end}}
  .dish .thumb{width:72px;height:56px;border-radius:8px;background:#f2e8da center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:#cbb9a1}
  .dish.off{opacity:.5}
  .tag{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--red-soft);color:var(--red);margin-left:6px}
  .order.done{opacity:.55}
  .order ul{margin:8px 0;padding-left:20px}
  .order li{margin:3px 0}
  .spice{color:var(--red);font-size:13px;margin-left:4px}
  .err{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>👨‍🍳 厨房后台</h1>

  <!-- 登录 -->
  <div id="login" class="card">
    <label for="pw">管理密码（部署时设置的 ADMIN_PASSWORD）</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="login-err"></div>
    <button class="btn primary" id="login-btn">进入</button>
  </div>

  <div id="app" class="hidden">
    <div class="tabs">
      <button class="tab on" data-tab="orders">订单</button>
      <button class="tab" data-tab="dishes">菜品</button>
    </div>

    <section id="tab-orders"></section>

    <section id="tab-dishes" class="hidden">
      <div class="card" id="form">
        <div class="row" style="justify-content:space-between"><strong id="form-title">添加新菜</strong>
          <button class="btn small hidden" id="cancel-edit">取消编辑</button></div>
        <div class="row" style="align-items:flex-start;margin-top:8px">
          <div class="preview" id="preview">📷</div>
          <div class="grow">
            <label for="img" style="margin-top:0">菜品照片</label>
            <input type="file" id="img" accept="image/*">
            <div class="muted">会自动压缩，手机直接拍也可以</div>
          </div>
        </div>
        <label for="d-name">菜名 *</label>
        <input type="text" id="d-name" maxlength="50">
        <label for="d-cat">分类（可不填，比如：家常菜、汤、甜品）</label>
        <input type="text" id="d-cat" maxlength="20" list="cat-list">
        <datalist id="cat-list"></datalist>
        <label for="d-desc">简介（可不填）</label>
        <textarea id="d-desc" maxlength="300"></textarea>
        <label class="check"><input type="checkbox" id="d-spicy" checked> 这道菜可以选辣度</label>
        <div class="err" id="form-err"></div>
        <button class="btn primary" id="save">保存</button>
      </div>
      <div id="dish-list"></div>
    </section>
  </div>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let PW = '';
try { PW = sessionStorage.getItem('dc_pw') || ''; } catch {}
let dishes = [], editing = null, imageUrl = '';

async function api(path, opts = {}){
  const r = await fetch(path, { ...opts, headers: { 'Content-Type':'application/json', 'x-admin-password': PW, ...(opts.headers||{}) } });
  const data = await r.json().catch(() => ({}));
  if(r.status === 401){ logout(); throw new Error('密码不对'); }
  if(!r.ok) throw new Error(data.error || '出错了');
  return data;
}

// ---------- 登录 ----------
async function tryLogin(){
  try{
    await api('/api/orders');
    try{ sessionStorage.setItem('dc_pw', PW); }catch{}
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadOrders(); loadDishes();
  }catch(e){
    document.getElementById('login-err').textContent = e.message;
  }
}
function logout(){
  PW = ''; try{ sessionStorage.removeItem('dc_pw'); }catch{}
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
document.getElementById('login-btn').onclick = () => { PW = document.getElementById('pw').value; tryLogin(); };
document.getElementById('pw').onkeydown = e => { if(e.key === 'Enter') document.getElementById('login-btn').click(); };
if(PW) tryLogin();

// ---------- 标签切换 ----------
document.querySelector('.tabs').onclick = e => {
  const t = e.target.closest('[data-tab]'); if(!t) return;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === t));
  document.getElementById('tab-orders').classList.toggle('hidden', t.dataset.tab !== 'orders');
  document.getElementById('tab-dishes').classList.toggle('hidden', t.dataset.tab !== 'dishes');
  if(t.dataset.tab === 'orders') loadOrders();
};

// ---------- 订单 ----------
async function loadOrders(){
  const el = document.getElementById('tab-orders');
  try{
    const orders = await api('/api/orders');
    if(!orders.length){ el.innerHTML = '<div class="card muted">还没有订单</div>'; return; }
    el.innerHTML = orders.map(o => `
      <div class="card order ${o.done?'done':''}">
        <div class="row" style="justify-content:space-between">
          <strong>${esc(o.customer_name)} <span class="muted">#${o.id}</span></strong>
          <span class="muted">${new Date(o.created_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
        </div>
        <ul>${o.items.map(i => `<li>${esc(i.name)} ×${i.qty}${i.spice ? `<span class="spice">${esc(i.spice)}</span>` : ''}</li>`).join('')}</ul>
        ${o.meal_time ? `<div class="muted">想吃的时间：${esc(o.meal_time)}</div>` : ''}
        ${o.note ? `<div class="muted">备注：${esc(o.note)}</div>` : ''}
        <div class="row" style="margin-top:10px"><button class="btn small" data-done="${o.id}" data-v="${o.done?0:1}">${o.done ? '标记为未完成' : '✓ 做好了'}</button></div>
      </div>`).join('');
  }catch(e){ el.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}
document.getElementById('tab-orders').onclick = async e => {
  const b = e.target.closest('[data-done]'); if(!b) return;
  b.disabled = true;
  try{ await api(`/api/orders?id=${b.dataset.done}`, { method:'PATCH', body: JSON.stringify({ done: b.dataset.v === '1' }) }); }
  catch(err){ alert(err.message); }
  loadOrders();
};

// ---------- 菜品 ----------
async function loadDishes(){
  const el = document.getElementById('dish-list');
  try{
    dishes = await api('/api/dishes?all=1');
    document.getElementById('cat-list').innerHTML = [...new Set(dishes.map(d => d.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('');
    el.innerHTML = dishes.length ? dishes.map(d => `
      <div class="card dish ${d.active?'':'off'}">
        <div class="thumb" style="${d.image_url ? `background-image:url('${esc(d.image_url)}')` : ''}">${d.image_url ? '' : '🍲'}</div>
        <div class="grow">
          <strong>${esc(d.name)}</strong>${d.spicy_option ? '<span class="tag">可选辣</span>' : ''}${d.active ? '' : '<span class="tag" style="background:#eee;color:#888">已下架</span>'}
          <div class="muted">${esc(d.category || '未分类')}</div>
        </div>
        <div class="row">
          <button class="btn small" data-edit="${d.id}">编辑</button>
          <button class="btn small" data-toggle="${d.id}">${d.active ? '下架' : '上架'}</button>
          <button class="btn small" data-del="${d.id}">删除</button>
        </div>
      </div>`).join('') : '<div class="card muted">还没有菜，先在上面添加一道吧</div>';
  }catch(e){ el.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

document.getElementById('dish-list').onclick = async e => {
  const b = e.target.closest('button'); if(!b) return;
  const id = Number(b.dataset.edit || b.dataset.toggle || b.dataset.del);
  const d = dishes.find(x => x.id === id);
  try{
    if(b.dataset.edit){ startEdit(d); return; }
    if(b.dataset.toggle) await api(`/api/dishes?id=${id}`, { method:'PATCH', body: JSON.stringify({ active: !d.active }) });
    if(b.dataset.del){
      if(!confirm(`确定删除「${d.name}」吗？下架可以保留，删除就没了。`)) return;
      await api(`/api/dishes?id=${id}`, { method:'DELETE' });
    }
    loadDishes();
  }catch(err){ alert(err.message); }
};

function setPreview(url){
  const p = document.getElementById('preview');
  p.style.backgroundImage = url ? `url('${url}')` : '';
  p.textContent = url ? '' : '📷';
}
function resetForm(){
  editing = null; imageUrl = '';
  ['d-name','d-cat','d-desc','img'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('d-spicy').checked = true;
  document.getElementById('form-title').textContent = '添加新菜';
  document.getElementById('cancel-edit').classList.add('hidden');
  document.getElementById('form-err').textContent = '';
  setPreview('');
}
function startEdit(d){
  editing = d.id; imageUrl = d.image_url || '';
  document.getElementById('d-name').value = d.name;
  document.getElementById('d-cat').value = d.category || '';
  document.getElementById('d-desc').value = d.description || '';
  document.getElementById('d-spicy').checked = d.spicy_option;
  document.getElementById('img').value = '';
  document.getElementById('form-title').textContent = `编辑：${d.name}`;
  document.getElementById('cancel-edit').classList.remove('hidden');
  setPreview(imageUrl);
  document.getElementById('form').scrollIntoView({ behavior:'smooth' });
}
document.getElementById('cancel-edit').onclick = resetForm;

// 把照片压缩成最长边 1200px 的 JPEG
function compress(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => reject(new Error('这张图片读不了，换一张试试'));
    img.src = URL.createObjectURL(file);
  });
}

document.getElementById('img').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  const err = document.getElementById('form-err');
  const save = document.getElementById('save');
  save.disabled = true; err.textContent = '照片上传中…';
  try{
    const data = await compress(f);
    setPreview(data);
    const { url } = await api('/api/upload', { method:'POST', body: JSON.stringify({ data }) });
    imageUrl = url; err.textContent = '';
  }catch(ex){ err.textContent = ex.message; }
  save.disabled = false;
};

document.getElementById('save').onclick = async () => {
  const err = document.getElementById('form-err');
  const body = {
    name: document.getElementById('d-name').value.trim(),
    category: document.getElementById('d-cat').value.trim(),
    description: document.getElementById('d-desc').value.trim(),
    spicy_option: document.getElementById('d-spicy').checked,
    image_url: imageUrl,
  };
  if(!body.name){ err.textContent = '菜名不能为空'; return; }
  const btn = document.getElementById('save'); btn.disabled = true;
  try{
    if(editing) await api(`/api/dishes?id=${editing}`, { method:'PATCH', body: JSON.stringify(body) });
    else await api('/api/dishes', { method:'POST', body: JSON.stringify(body) });
    resetForm(); loadDishes();
  }catch(ex){ err.textContent = ex.message; }
  btn.disabled = false;
};
</script>
</body>
</html>
